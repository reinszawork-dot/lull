<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lull: Calm, Cravings &amp; Sleep</title>
  <meta name="description" content="Lull: a free, private app for stress, stress eating and sleep. Breathing, craving SOS, sleep sounds and stories." />
  <meta name="theme-color" content="#0d0f1f" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Lull" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"><canvas id="stars"></canvas><span class="glow g1"></span><span class="glow g2"></span></div>

  <div class="app">
    <header class="topbar">
      <button class="time-pill" id="bedPill" data-act="tab:sleep" aria-label="Bedtime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M5 3 2 6M19 3l3 3"/></svg>
        <span id="bedPillText">22:30</span>
      </button>
      <div class="top-actions">
        <button class="icon-btn" data-act="tab:journey" aria-label="Journey"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
        <button class="avatar" id="settingsBtn" aria-label="Settings" title="Settings"><span id="avatarText">L</span></button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <button class="now-playing" id="nowPlaying" hidden>
    <span class="eq"><i></i><i></i><i></i></span><span id="npText">Sounds playing</span><span class="np-stop" id="npStop">Stop</span>
  </button>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active">For you</button>
    <button data-tab="breathe">Breathe</button>
    <button data-tab="pause" class="sos">Pause</button>
    <button data-tab="sleep">Sleep</button>
    <button data-tab="journey">Journey</button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="overlay" id="overlay" role="dialog" aria-modal="true" hidden></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="nextwave-pro.js"></script>
  <script src="content.js"></script>
  <script src="pro-content.js"></script>
  <script src="scenes.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
