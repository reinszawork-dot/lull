<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lull: Calm, Cravings &amp; Sleep</title>
  <meta name="description" content="Lull: a free, private app for stress, stress eating and sleep. Breathing, craving SOS, sleep sounds and stories." />
  <meta name="theme-color" content="#0d0f1f" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Lull" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"><canvas id="stars"></canvas><span class="glow g1"></span><span class="glow g2"></span></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><path d="M20 4a12 12 0 1 0 8 20A10 10 0 0 1 20 4z" fill="currentColor"/></svg>
        </span>
        <div>
          <h1>Lull</h1>
          <p class="sub" id="todayLabel"></p>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <button class="now-playing" id="nowPlaying" hidden>
    <span class="eq"><i></i><i></i><i></i></span><span id="npText">Sounds playing</span><span class="np-stop" id="npStop">Stop</span>
  </button>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span>Today</span></button>
    <button data-tab="breathe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/></svg><span>Breathe</span></button>
    <button data-tab="pause" class="sos"><span class="sos-dot"><svg viewBox="0 0 24 24"><path d="M8 6h3v12H8zM13 6h3v12h-3z"/></svg></span><span>Pause</span></button>
    <button data-tab="sleep"><svg viewBox="0 0 24 24"><path d="M3 18h18v2H3zM4 11h16a1 1 0 0 1 1 1v5H3v-5a1 1 0 0 1 1-1zM6 7h5a1 1 0 0 1 1 1v3H5V8a1 1 0 0 1 1-1z"/></svg><span>Sleep</span></button>
    <button data-tab="journey"><svg viewBox="0 0 24 24"><path d="M3 20h18v2H3zM5 13h3v6H5zM10.5 9h3v10h-3zM16 5h3v14h-3z"/></svg><span>Journey</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="overlay" id="overlay" role="dialog" aria-modal="true" hidden></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="content.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
